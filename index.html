<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Subtitle Downloader</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #ff7e5f, #feb47b);
            color: white;
            text-align: center;
            padding: 50px;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        input[type="text"] {
            padding: 10px;
            width: 300px;
            margin-bottom: 20px;
            border: none;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>YouTube Subtitle Downloader</h1>
    <input type="text" placeholder="Enter YouTube Video URL" />
    <br>
    <button onclick="downloadSubtitles()">Download Subtitles</button>

    <script>
        function downloadSubtitles() {
            const url = document.querySelector('input[type="text"]').value;
            if (!url) {
                alert('Please enter a video URL!');
                return;
            }
            // Add logic to download subtitles from YouTube
            alert('Downloading subtitles for: ' + url);
        }
    </script>
</body>
</html>
